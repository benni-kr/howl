services:
  - type: web
    name: howl-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: howl-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true

databases:
  - name: howl-db
    databaseName: howldb
    user: howluser
    plan: free
